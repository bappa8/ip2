<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>IP Lookup Tool</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #000000, #050511, #0a0a1f);
    min-height: 100vh;
    color: #f1f1f1;
    padding: 30px 20px;
  }

  .search-bar {
    display: flex;
    max-width: 1200px;
    margin: 0 auto 25px;
    gap: 0;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 25px rgba(0, 242, 254, 0.3);
  }

  .search-bar input {
    flex: 1;
    padding: 16px 20px;
    font-size: 1.2rem;
    border: none;
    outline: none;
    background: #0a0a1a;
    color: #00f2fe;
    font-weight: 600;
  }

  .search-bar input::placeholder { color: #3a3f5c; }

  .search-bar button {
    padding: 16px 32px;
    font-size: 1.2rem;
    border: none;
    cursor: pointer;
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    color: #0f0c29;
    font-weight: 700;
    letter-spacing: 1px;
    transition: transform .2s, box-shadow .2s;
  }

  .search-bar button:hover {
    transform: scale(1.03);
    box-shadow: 0 0 20px #00f2fe;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
  }

  .info-card, .map-card {
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 1.05rem;
  }

  table tr {
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    transition: background .2s;
  }

  table tr:last-child { border-bottom: none; }
  table tr:hover { background: rgba(0, 242, 254, 0.08); }

  table td {
    padding: 14px 12px;
    vertical-align: middle;
  }

  table td:first-child {
    color: #f093fb;
    font-weight: 600;
    width: 40%;
    font-size: 1.05rem;
  }

  table td:last-child {
    color: #00f2fe;
    font-weight: 500;
  }

  .update-link {
    float: right;
    color: #f093fb;
    text-decoration: none;
    font-style: italic;
    font-size: 0.95rem;
    cursor: pointer;
  }

  .update-link:hover { text-decoration: underline; }

  .flag { margin-right: 6px; font-size: 1.2rem; }

  .map-card {
    padding: 0;
    overflow: hidden;
    min-height: 500px;
    display: flex;
  }

  #map {
    width: 100%;
    height: 100%;
    min-height: 500px;
    border: 0;
  }

  footer {
    text-align: center;
    margin-top: 40px;
    padding: 20px;
    font-size: 1.1rem;
    background: linear-gradient(90deg, #f093fb, #4facfe);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 600;
  }

  @media (max-width: 850px) {
    .container { grid-template-columns: 1fr; }
    .map-card, #map { min-height: 400px; }
  }
</style>

<body>

  <div class="search-bar">
    <input type="text" id="ipInput" placeholder="Enter an IP address (leave blank for your own)..."/>
    <button onclick="lookupIP()">IP Lookup</button>
  </div>

  <div class="container">
    <!-- Left: Info Table -->
    <div class="info-card">
      <table>
        <tr><td>IP Address</td><td id="ip">—</td></tr>
        <tr>
          <td>City</td>
          <td>
            <span id="city">—</span>
            <a class="update-link" onclick="lookupIP()">Update</a>
          </td>
        </tr>
        <tr><td>Region</td><td id="region">—</td></tr>
        <tr><td>Country</td><td id="country">—</td></tr>
        <tr><td>Postal Code</td><td id="postal">—</td></tr>
        <tr><td>Latitude / Longitude</td><td id="latlng">—</td></tr>
        <tr><td>Time Zone</td><td id="timezone">—</td></tr>
        <tr><td>Currency</td><td id="currency">—</td></tr>
        <tr><td>ASN</td><td id="asn">—</td></tr>
        <tr><td>Org</td><td id="org">—</td></tr>
      </table>
    </div>

    <!-- Right: Map -->
    <div class="map-card">
      <iframe id="map" src="https://www.google.com/maps?q=0,0&amp;z=2&amp;output=embed" allowfullscreen="" loading="lazy">
      </iframe>
    </div>
  </div>

  <footer>
    © Bappa Ghosh. All rights reserved.
  </footer>

<script>
  // Convert country code -> flag emoji
  function flagEmoji(code) {
    if (!code) return '🏳️';
    return String.fromCodePoint(
      ...[...code.toUpperCase()].map(c => 0x1F1E6 - 65 + c.charCodeAt(0))
    );
  }

  // Try multiple APIs so it works for both blank (own IP) and entered IPs.
  async function fetchIPData(ip) {
    // 1) ipwho.is — supports HTTPS + CORS, and works with empty path for own IP
    try {
      const url = ip ? `https://ipwho.is/${encodeURIComponent(ip)}` : 'https://ipwho.is/';
      const res = await fetch(url);
      const data = await res.json();
      if (data && data.success !== false) {
        return {
          ip: data.ip,
          city: data.city,
          region: data.region,
          country_code: data.country_code,
          country_name: data.country,
          postal: data.postal,
          latitude: data.latitude,
          longitude: data.longitude,
          timezone: data.timezone && (data.timezone.id || data.timezone),
          tz_offset: data.timezone && data.timezone.utc,
          currency: data.currency && (data.currency.code || data.currency),
          asn: data.connection && data.connection.asn ? 'AS' + data.connection.asn : '',
          org: data.connection && (data.connection.org || data.connection.isp) || ''
        };
      }
    } catch (e) { console.warn('ipwho.is failed', e); }

    // 2) Fallback: ipapi.co
    try {
      const url = ip ? `https://ipapi.co/${encodeURIComponent(ip)}/json/` : 'https://ipapi.co/json/';
      const res = await fetch(url);
      const data = await res.json();
      if (data && !data.error) {
        return {
          ip: data.ip,
          city: data.city,
          region: data.region,
          country_code: data.country_code,
          country_name: data.country_name,
          postal: data.postal,
          latitude: data.latitude,
          longitude: data.longitude,
          timezone: data.timezone,
          tz_offset: data.utc_offset,
          currency: data.currency,
          asn: data.asn,
          org: data.org
        };
      }
    } catch (e) { console.warn('ipapi.co failed', e); }

    // 3) Final fallback: get own IP via ipify, then look it up
    if (!ip) {
      try {
        const r = await fetch('https://api.ipify.org?format=json');
        const j = await r.json();
        if (j.ip) return fetchIPData(j.ip);
      } catch (e) { console.warn('ipify failed', e); }
    }

    return null;
  }

  async function lookupIP() {
    const ip = document.getElementById('ipInput').value.trim();
    const data = await fetchIPData(ip);

    if (!data) {
      alert('Failed to fetch IP data. Please check the IP or try again.');
      return;
    }

    document.getElementById('ip').textContent = data.ip || '—';
    document.getElementById('city').textContent = data.city || '—';
    document.getElementById('region').textContent = data.region || '—';

    document.getElementById('country').innerHTML =
      `<span class="flag">${flagEmoji(data.country_code)}</span>${data.country_code || ''}${data.country_name ? ' | ' + data.country_name : ''}`;

    document.getElementById('postal').textContent = data.postal || '—';
    document.getElementById('latlng').textContent =
      (data.latitude ?? '—') + ' , ' + (data.longitude ?? '—');
    document.getElementById('timezone').textContent =
      data.timezone ? (data.tz_offset ? `${data.timezone} (${data.tz_offset})` : data.timezone) : '—';
    document.getElementById('currency').textContent = data.currency || '—';
    document.getElementById('asn').textContent = data.asn || '—';
    document.getElementById('org').textContent = data.org || '—';

    if (data.latitude && data.longitude) {
      document.getElementById('map').src =
        `https://www.google.com/maps?q=${data.latitude},${data.longitude}&z=6&output=embed`;
    }
  }

  // Auto-load user's own IP on page load
  window.addEventListener('DOMContentLoaded', lookupIP);
</script>
