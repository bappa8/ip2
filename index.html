<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IP Lookup Tool</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #000000, #050511, #0a0a1f);
    min-height: 100vh;
    color: #f1f1f1;
    padding: 30px 20px;
  }

  .search-bar {
    display: flex;
    max-width: 1200px;
    margin: 0 auto 15px;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 25px rgba(0, 242, 254, 0.3);
  }

  .search-bar input {
    flex: 1;
    padding: 16px 20px;
    font-size: 1.2rem;
    border: none;
    outline: none;
    background: #0a0a1a;
    color: #00f2fe;
    font-weight: 600;
  }

  .search-bar input::placeholder { color: #3a3f5c; }

  .search-bar button {
    padding: 16px 32px;
    font-size: 1.2rem;
    border: none;
    cursor: pointer;
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    color: #0f0c29;
    font-weight: 700;
    letter-spacing: 1px;
    transition: transform .2s, box-shadow .2s;
  }

  .search-bar button:hover {
    transform: scale(1.03);
    box-shadow: 0 0 20px #00f2fe;
  }

  .status {
    max-width: 1200px;
    margin: 0 auto 15px;
    text-align: center;
    font-size: 0.95rem;
    color: #f093fb;
    min-height: 22px;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
  }

  .info-card, .map-card {
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 1.05rem;
  }

  table tr {
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    transition: background .2s;
  }

  table tr:last-child { border-bottom: none; }
  table tr:hover { background: rgba(0, 242, 254, 0.08); }

  table td { padding: 14px 12px; vertical-align: middle; }

  table td:first-child {
    color: #f093fb;
    font-weight: 600;
    width: 40%;
    font-size: 1.05rem;
  }

  table td:last-child { color: #00f2fe; font-weight: 500; }

  .flag { margin-right: 6px; font-size: 1.2rem; }

  .map-card {
    padding: 0;
    overflow: hidden;
    min-height: 500px;
    display: flex;
  }

  #map { width: 100%; height: 100%; min-height: 500px; border: 0; }

  footer {
    text-align: center;
    margin-top: 40px;
    padding: 20px;
    font-size: 1.1rem;
    background: linear-gradient(90deg, #f093fb, #4facfe);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 600;
  }

  @media (max-width: 850px) {
    .container { grid-template-columns: 1fr; }
    .map-card, #map { min-height: 400px; }
  }

  table td.ip-value {
    font-size: 1.5rem;
    font-weight: 800;
    color: #00f2fe;
    letter-spacing: 0.5px;
    text-shadow: 0 0 12px rgba(0, 242, 254, 0.4);
  }
</style>
</head>
<body>

  <div class="search-bar">
    <input type="text" id="ipInput" placeholder="Enter an IP address (leave blank for your own)..." />
    <button onclick="lookupIP()">IP Lookup</button>
  </div>

  <div class="status" id="status"></div>

  <div class="container">
    <div class="info-card">
      <table>
        <tr><td>IP Address</td><td id="ip" class="ip-value">—</td></tr>
        <tr><td>Country</td><td id="country">—</td></tr>
        <tr><td>City</td><td id="city">—</td></tr>
        <tr><td>Region</td><td id="region">—</td></tr>
        <tr><td>Latitude</td><td id="latitude">—</td></tr>
        <tr><td>Longitude</td><td id="longitude">—</td></tr>
        <tr><td>Time Zone</td><td id="timezone">—</td></tr>
        <tr><td>ASN</td><td id="asn">—</td></tr>
        <tr><td>Organization</td><td id="org">—</td></tr>
      </table>
    </div>

    <div class="map-card">
      <iframe id="map"
        src="https://www.google.com/maps?q=0,0&z=2&output=embed"
        allowfullscreen loading="lazy"></iframe>
    </div>
  </div>

  <footer>© Bappa Ghosh. All rights reserved.</footer>

<script>
  const setStatus = (msg, color = '#f093fb') => {
    const s = document.getElementById('status');
    s.textContent = msg;
    s.style.color = color;
  };

  function flagEmoji(code) {
    if (!code) return '🏳️';
    return String.fromCodePoint(
      ...[...code.toUpperCase()].map(c => 0x1F1E6 - 65 + c.charCodeAt(0))
    );
  }

  // Timeout helper
  function fetchJSON(url, ms = 6000) {
    return new Promise((resolve, reject) => {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), ms);
      fetch(url, { signal: ctrl.signal, headers: { 'Accept': 'application/json' } })
        .then(r => {
          clearTimeout(t);
          if (!r.ok) return reject(new Error('HTTP ' + r.status));
          return r.json().then(resolve, reject);
        })
        .catch(err => { clearTimeout(t); reject(err); });
    });
  }

  const providers = [
    {
      name: 'geojs.io',
      url: ip => ip
        ? `https://get.geojs.io/v1/ip/geo/${encodeURIComponent(ip)}.json`
        : `https://get.geojs.io/v1/ip/geo.json`,
      map: d => ({
        ip: d.ip, city: d.city, region: d.region,
        country_code: d.country_code, country_name: d.country,
        latitude: d.latitude, longitude: d.longitude,
        timezone: d.timezone, tz_offset: d.offset,
        asn: d.asn ? 'AS' + d.asn : '',
        org: d.organization_name || d.organization || ''
      })
    },
    {
      name: 'ipwho.is',
      url: ip => ip ? `https://ipwho.is/${encodeURIComponent(ip)}` : `https://ipwho.is/`,
      map: d => {
        if (d.success === false) throw new Error(d.message || 'ipwho.is failed');
        return {
          ip: d.ip, city: d.city, region: d.region,
          country_code: d.country_code, country_name: d.country,
          latitude: d.latitude, longitude: d.longitude,
          timezone: d.timezone && (d.timezone.id || ''),
          tz_offset: d.timezone && d.timezone.utc,
          asn: d.connection && d.connection.asn ? 'AS' + d.connection.asn : '',
          org: (d.connection && (d.connection.org || d.connection.isp)) || ''
        };
      }
    },
    {
      name: 'freeipapi.com',
      url: ip => ip
        ? `https://freeipapi.com/api/json/${encodeURIComponent(ip)}`
        : `https://freeipapi.com/api/json`,
      map: d => ({
        ip: d.ipAddress, city: d.cityName, region: d.regionName,
        country_code: d.countryCode, country_name: d.countryName,
        latitude: d.latitude, longitude: d.longitude,
        timezone: d.timeZone, tz_offset: '',
        asn: '', org: ''
      })
    },
    {
      name: 'ipapi.co',
      url: ip => ip ? `https://ipapi.co/${encodeURIComponent(ip)}/json/` : `https://ipapi.co/json/`,
      map: d => {
        if (d.error) throw new Error(d.reason || 'ipapi.co failed');
        return {
          ip: d.ip, city: d.city, region: d.region,
          country_code: d.country_code, country_name: d.country_name,
          latitude: d.latitude, longitude: d.longitude,
          timezone: d.timezone, tz_offset: d.utc_offset,
          asn: d.asn, org: d.org
        };
      }
    }
  ];

  async function fetchIPData(ip) {
    let lastErr;
    for (const p of providers) {
      try {
        const raw = await fetchJSON(p.url(ip));
        const data = p.map(raw);
        if (data && (data.ip || data.latitude)) {
          setStatus('');
          return data;
        }
      } catch (e) {
        console.warn(p.name, 'failed:', e.message || e);
        lastErr = e;
      }
    }
    throw lastErr || new Error('All providers failed');
  }

  async function lookupIP() {
    const ip = document.getElementById('ipInput').value.trim();
    setStatus('Looking up…');
    try {
      const data = await fetchIPData(ip);

      document.getElementById('ip').textContent = data.ip || '—';
      document.getElementById('city').textContent = data.city || '—';
      document.getElementById('region').textContent = data.region || '—';
      document.getElementById('country').innerHTML =
        `<span class="flag">${flagEmoji(data.country_code)}</span>${data.country_name || ''}`;
      document.getElementById('latitude').textContent = data.latitude ?? '—';
      document.getElementById('longitude').textContent = data.longitude ?? '—';
      document.getElementById('timezone').textContent =
        data.timezone ? (data.tz_offset ? `${data.timezone} (${data.tz_offset})` : data.timezone) : '—';
      document.getElementById('asn').textContent = data.asn || '—';
      document.getElementById('org').textContent = data.org || '—';

      if (data.latitude && data.longitude) {
        document.getElementById('map').src =
          `https://www.google.com/maps?q=${data.latitude},${data.longitude}&z=6&output=embed`;
      }
    } catch (err) {
      console.error(err);
      setStatus('⚠️ Failed to fetch IP data. Check your network/ad-blocker and try again.', '#ff6b6b');
    }
  }

  window.addEventListener('DOMContentLoaded', lookupIP);
</script>

</body>
</html>
